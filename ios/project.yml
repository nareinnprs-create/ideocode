name: IDEOCODEMobile
options:
  bundleIdPrefix: com.IDEOCODE
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  IDEOCODEKit:
    path: .

targets:
  IDEOCODEMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/IDEOCODEMobile
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: Sources/IDEOCODEMobile/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.IDEOCODE.mobile
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TAS6ARKDN7
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: IDEOCODEKit
        product: IDEOCODEKit
