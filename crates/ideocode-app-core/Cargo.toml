[package]
name = "ideocode-app-core"
version = "0.1.0"
edition = "2024"
publish = false

# Application core for ideocode: all non-presentation modules (server, agent,
# provider, auth, session, tool, config, etc.) extracted out of the monolithic
# root `ideocode` crate so they compile as a separate rustc unit. The root `ideocode`
# crate (cli + tui + bin) re-exports this crate's modules via `pub use
# ideocode_app_core::*`, preserving every existing `crate::<module>` path.

[lib]
name = "ideocode_app_core"
path = "src/lib.rs"

[dependencies]
# NOTE: the jemalloc allocator stats live in `ideocode-base` (process_memory) and
# local embeddings live in `ideocode-base` (embedding); this crate forwards those
# features to ideocode-base rather than depending on the backing crates directly.

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# CLI

# File operations
glob = "0.3"
similar = "2"            # diffing for edits

# Utilities
dirs = "5"               # home directory
anyhow = "1"
libc = "0.2"             # Unix system calls (flock)
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
urlencoding = "2"        # URL encoding for web search
uuid = { version = "1", features = ["v4", "v5"] }

# Embeddings (local inference) live in ideocode-base; this crate forwards the
# `embeddings` feature to ideocode-base rather than depending on ideocode-embedding.
ideocode-import-core = { path = "../ideocode-import-core" }

# OAuth
base64 = "0.22"
sha2 = "0.10"
rand = "0.9.3"
url = "2"
open = "5"               # Open URLs in browser
ideocode-agent-runtime = { path = "../ideocode-agent-runtime" }
ideocode-ambient-types = { path = "../ideocode-ambient-types" }
ideocode-notify-email = { path = "../ideocode-notify-email" }
ideocode-provider-core = { path = "../ideocode-provider-core" }
# NOTE: ideocode-app-core does NOT depend on any ideocode-tui-* crate. They were
# unused dead dependency edges here (the TUI declares them itself). Removing
# them stops a ideocode-tui-* edit from cascading a recompile through app-core.
ideocode-update-core = { path = "../ideocode-update-core" }
ideocode-terminal-image = { path = "../ideocode-terminal-image" }

# Streaming
tokio-stream = "0.1"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# Markdown & syntax highlighting
unicode-width = "0.2"   # Unicode character display width

# PDF parsing (behind feature flag)
ideocode-pdf = { path = "../ideocode-pdf", optional = true }
ideocode-build-support = { path = "../ideocode-build-support" }
ideocode-build-meta = { path = "../ideocode-build-meta" }

# Foundational layer (provider, auth, config, session, message, memory, ...).
# Re-exported via `pub use ideocode_base::*` in lib.rs. default-features=false so
# this crate controls ideocode-base's optional features (see [features] below).
ideocode-base = { path = "../ideocode-base", default-features = false }
ideocode-core = { path = "../ideocode-core" }
ideocode-message-types = { path = "../ideocode-message-types" }
ideocode-overnight-core = { path = "../ideocode-overnight-core" }
ideocode-plan = { path = "../ideocode-plan" }
ideocode-swarm-core = { path = "../ideocode-swarm-core" }
ideocode-selfdev-types = { path = "../ideocode-selfdev-types" }
ideocode-session-types = { path = "../ideocode-session-types" }
ideocode-setup-hints = { path = "../ideocode-setup-hints" }
ideocode-task-types = { path = "../ideocode-task-types" }
ideocode-tool-core = { path = "../ideocode-tool-core" }
ideocode-tool-types = { path = "../ideocode-tool-types" }

# Archive extraction (for auto-update)
flate2 = "1"
tar = "0.4"
tempfile = "3"
agentgrep = { git = "https://github.com/nareinnprs-create/agentgrep.git", tag = "v0.1.6" }

[features]
default = ["pdf", "embeddings", "bedrock"]
# jemalloc allocator stats live in ideocode-base (process_memory); forward there.
jemalloc = ["ideocode-base/jemalloc"]
jemalloc-prof = ["ideocode-base/jemalloc-prof"]
# local embeddings live in ideocode-base (embedding); forward there.
embeddings = ["ideocode-base/embeddings"]
# live AWS Bedrock support lives in ideocode-base (provider/bedrock); forward there.
bedrock = ["ideocode-base/bedrock"]
# Used only by the CentOS 7 portable Linux release build.
linux-compat-vendored-openssl = ["ideocode-notify-email/linux-compat-vendored-openssl"]
# PDF text extraction lives in this crate (tool/read.rs).
pdf = ["dep:ideocode-pdf"]
# Compiles this crate's test-only helpers/accessors (e.g. the
# ExternalAuthReviewCandidate read accessors) as `pub` and forwards
# ideocode-base's `test-support` so downstream crates' test targets can reach the
# whole stack's helpers. Never enabled in normal (non-test) builds.
test-support = ["ideocode-base/test-support"]

[dev-dependencies]
# Used by async streaming tests (ambient/runner_tests, server/client_actions_tests).
async-stream = "0.3"
# Enables ideocode-base's test-support helpers (storage::lock_test_env,
# auth::test_sandbox, bus::reset_models_updated_publish_state_for_tests) for
# *this* crate's own test target. Feature unification applies this only to
# test/bench/example builds, not to a normal `cargo build`.
ideocode-base = { path = "../ideocode-base", default-features = false, features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"
# Native desktop control for the `macos_computer_use` tool (synthetic mouse/keyboard
# events, cursor positioning, display bounds). `highsierra` enables the
# CGEventCreateScrollWheelEvent2 binding used for scroll.
core-graphics = { version = "0.23", features = ["highsierra"] }
