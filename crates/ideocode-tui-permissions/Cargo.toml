[package]
name = "ideocode-tui-permissions"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "ideocode_tui_permissions"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = { version = "0.29", features = ["event-stream"] }
ideocode-base = { path = "../ideocode-base", default-features = false }
ideocode-core = { path = "../ideocode-core" }
ideocode-tui-style = { path = "../ideocode-tui-style" }
ratatui = "0.30"
serde_json = "1"
