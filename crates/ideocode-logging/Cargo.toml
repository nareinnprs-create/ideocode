[package]
name = "ideocode-logging"
version = "0.1.0"
edition = "2024"
description = "File logging, structured events, and thread/task-local logging context for ideocode"

[lib]
name = "ideocode_logging"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt"] }
ideocode-core = { path = "../ideocode-core" }
ideocode-storage = { path = "../ideocode-storage" }
