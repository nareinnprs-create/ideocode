[package]
name = "ideocode-gui"
version = "0.62.0"
license = "MIT"
edition = "2021"
description = "IDEOCODE Desktop GUI — Tauri 2.x + React"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
dirs = "5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3

[[bin]]
name = "ideocode-gui"
path = "src/main.rs"
