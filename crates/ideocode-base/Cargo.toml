[package]
name = "ideocode-base"
version = "0.1.0"
license = "MIT"
edition = "2024"
publish = false

# Foundational layer of the ideocode application core: the downward-closed set of
# modules (provider, auth, config, session, message, memory, telemetry, ...)
# that the server/tool/agent layer depends on. Split out of `ideocode-app-core` so
# the two halves compile as separate rustc units, halving peak compile memory.
# `ideocode-app-core` re-exports this crate (`pub use ideocode_base::*`) so that every
# existing `crate::<module>` path keeps resolving unchanged.

[lib]
name = "ideocode_base"
path = "src/lib.rs"

[dependencies]
# Memory allocator (reduces fragmentation for long-running server)
tikv-jemalloc-ctl = { version = "0.6", optional = true }
tikv-jemalloc-sys = { version = "0.6", optional = true }

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
toml = "0.8"

# File operations

# Utilities
dirs = "5"               # home directory
anyhow = "1"
libc = "0.2"             # Unix system calls (flock)
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
urlencoding = "2"        # URL encoding for web search
uuid = { version = "1", features = ["v4", "v5"] }
proctitle = "0.1"

# Embeddings (local inference) - behind feature flag (163 crates, slow to compile)
ideocode-embedding = { path = "../ideocode-embedding", optional = true }
ideocode-gateway-types = { path = "../ideocode-gateway-types" }
ideocode-import-core = { path = "../ideocode-import-core" }
ideocode-logging = { path = "../ideocode-logging" }

# OAuth
base64 = "0.22"
sha2 = "0.10"
rand = "0.9.3"
hex = "0.4"
url = "2"
open = "5"               # Open URLs in browser
ideocode-auth-types = { path = "../ideocode-auth-types" }
ideocode-azure-auth = { path = "../ideocode-azure-auth" }
ideocode-agent-runtime = { path = "../ideocode-agent-runtime" }
ideocode-provider-metadata = { path = "../ideocode-provider-metadata" }
ideocode-provider-env = { path = "../ideocode-provider-env" }
ideocode-provider-core = { path = "../ideocode-provider-core" }
# default-features=false so this crate's `bedrock` feature (below) controls the
# AWS SDK stack; the pure model-metadata/credential-detection layer is always on.
ideocode-provider-bedrock = { path = "../ideocode-provider-bedrock", default-features = false }
ideocode-provider-antigravity = { path = "../ideocode-provider-antigravity" }
ideocode-provider-copilot = { path = "../ideocode-provider-copilot" }
ideocode-provider-openai = { path = "../ideocode-provider-openai" }
ideocode-provider-openrouter = { path = "../ideocode-provider-openrouter" }
ideocode-provider-gemini = { path = "../ideocode-provider-gemini" }
# NOTE: this foundation layer intentionally does NOT depend on any `ideocode-tui-*`
# crate. The two pure-data/string symbols it used to reach for (`ResumeTarget`,
# `reasoning_line_markup`) were moved to `ideocode-session-types` and
# `ideocode-render-core` respectively, so the layering inversion (foundation
# depending on presentation) is gone.
ideocode-render-core = { path = "../ideocode-render-core" }
ideocode-terminal-launch = { path = "../ideocode-terminal-launch" }
ideocode-terminal-image = { path = "../ideocode-terminal-image" }
ideocode-telemetry-core = { path = "../ideocode-telemetry-core" }
ideocode-usage-types = { path = "../ideocode-usage-types" }

# Streaming

# Terminal I/O (event stream for interactive auth/secret prompts). NOTE: the
# heavier presentation deps (ratatui widgets, arboard clipboard) were dropped
# from this foundation layer; they are unused here and live only in `ideocode-tui`.
crossterm = { version = "0.29", features = ["event-stream"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }  # Only PNG/JPEG (skip avif/rav1e, exr, gif, tiff, etc)

# NOTE: PDF text extraction (ideocode-pdf) lives in the upper ideocode-app-core crate
# (tool/read.rs), not here.
ideocode-background-types = { path = "../ideocode-background-types" }
ideocode-batch-types = { path = "../ideocode-batch-types" }
ideocode-build-meta = { path = "../ideocode-build-meta" }
ideocode-compaction-core = { path = "../ideocode-compaction-core" }
ideocode-config-types = { path = "../ideocode-config-types" }
ideocode-core = { path = "../ideocode-core" }
ideocode-memory-types = { path = "../ideocode-memory-types" }
ideocode-message-types = { path = "../ideocode-message-types" }
ideocode-plan = { path = "../ideocode-plan" }
ideocode-protocol = { path = "../ideocode-protocol" }
ideocode-session-types = { path = "../ideocode-session-types" }
ideocode-storage = { path = "../ideocode-storage" }
ideocode-task-types = { path = "../ideocode-task-types" }
ideocode-tool-core = { path = "../ideocode-tool-core" }
ideocode-tool-types = { path = "../ideocode-tool-types" }
ideocode-side-panel-types = { path = "../ideocode-side-panel-types" }

# Gzip decoding (used by provider import/helpers)
tempfile = "3"
qrcode = { version = "0.14.1", default-features = false }

[features]
default = ["embeddings", "bedrock"]
# Compiles the in-crate test helpers (storage::lock_test_env,
# auth::test_sandbox, bus::reset_models_updated_publish_state_for_tests, ...) as
# `pub` so downstream crates' test targets can reach them. Enabled as a
# dev-dependency feature by ideocode-app-core / ideocode / etc.; never in normal
# (non-test) builds.
test-support = []
jemalloc = [
    "dep:tikv-jemalloc-ctl",
    "dep:tikv-jemalloc-sys",
    "tikv-jemalloc-ctl/stats",
]
jemalloc-prof = [
    "jemalloc",
    "tikv-jemalloc-ctl/profiling",
]
embeddings = ["dep:ideocode-embedding"]
# Live AWS Bedrock support (the ~20-crate AWS SDK stack) lives in
# ideocode-provider-bedrock (aws-sdk); forward there. Without it the Bedrock
# provider still compiles but live calls return an explanatory error.
bedrock = ["ideocode-provider-bedrock/aws-sdk"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"

[dev-dependencies]
# Dev-only cycle (cargo permits dev-dependencies on dependents): base's
# MultiProvider routing tests exercise the real OpenRouter/OpenAI-compatible
# runtime through the composition-root registry, exactly like the binary.
ideocode-provider-openrouter-runtime = { path = "../ideocode-provider-openrouter-runtime" }
