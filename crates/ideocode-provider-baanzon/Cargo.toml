[package]
name = "ideocode-provider-baanzon"
version = "0.1.0"
edition = "2024"
description = "Baanzon Verso built-in AI engine: vendored install, first-run setup and self-heal supervision"
license = "MIT"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dirs = "5"
chrono = "0.4"
lazy_static = "1.5.0"
