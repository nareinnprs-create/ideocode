[package]
name = "ideocode-provider-openai"
version = "0.1.0"
license = "MIT"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
futures = "0.3"
ideocode-core = { path = "../ideocode-core" }
ideocode-logging = { path = "../ideocode-logging" }
ideocode-message-types = { path = "../ideocode-message-types" }
ideocode-provider-core = { path = "../ideocode-provider-core" }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
