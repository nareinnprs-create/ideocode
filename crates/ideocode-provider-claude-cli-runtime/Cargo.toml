[package]
name = "ideocode-provider-claude-cli-runtime"
version = "0.1.0"
license = "MIT"
edition = "2024"
description = "Deprecated Claude CLI provider runtime (subprocess transport) for ideocode, kept downstream of ideocode-base so provider edits do not rebuild the app spine"

[lib]
name = "ideocode_provider_claude_cli_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
# default-features = false: the top-level binary decides heavy optional base
# features (embeddings/bedrock). Runtime crates must not re-enable them via
# feature unification, or --no-default-features release targets (e.g. Windows
# ARM64, which cannot build tract-linalg asm) break.
ideocode-base = { path = "../ideocode-base", default-features = false }
ideocode-message-types = { path = "../ideocode-message-types" }
ideocode-provider-core = { path = "../ideocode-provider-core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "process", "io-util"] }
tokio-stream = "0.1"
