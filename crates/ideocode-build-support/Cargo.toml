[package]
name = "ideocode-build-support"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ideocode-core = { path = "../ideocode-core" }
ideocode-selfdev-types = { path = "../ideocode-selfdev-types" }
ideocode-storage = { path = "../ideocode-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
