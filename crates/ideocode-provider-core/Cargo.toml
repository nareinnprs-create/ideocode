[package]
name = "ideocode-provider-core"
version = "0.1.0"
license = "MIT"
edition = "2024"

[lib]
name = "ideocode_provider_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
httpdate = "1"
ideocode-logging = { path = "../ideocode-logging" }
ideocode-message-types = { path = "../ideocode-message-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9.3"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt"] }
