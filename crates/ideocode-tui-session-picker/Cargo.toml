[package]
name = "ideocode-tui-session-picker"
version = "0.1.0"
license = "MIT"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
ideocode-message-types = { path = "../ideocode-message-types" }
ideocode-session-types = { path = "../ideocode-session-types" }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
