[package]
name = "ideocode-desktop2"
version = "0.1.0"
license = "MIT"
edition = "2024"
publish = false
description = "Greenfield ideocode desktop app: winit + wgpu + Vello + Parley over the harness API"

[dependencies]
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
ideocode-harness-api = { path = "../ideocode-harness-api" }
parley = "0.11"
pollster = "0.3"
vello = "0.9"
winit = "0.30"

[[bin]]
name = "ideocode-desktop2"
path = "src/main.rs"
