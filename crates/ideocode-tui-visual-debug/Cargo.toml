[package]
name = "ideocode-tui-visual-debug"
version = "0.1.0"
license = "MIT"
edition = "2024"
publish = false

[lib]
name = "ideocode_tui_visual_debug"
path = "src/lib.rs"

[dependencies]
dirs = "5"
ideocode-logging = { path = "../ideocode-logging" }
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
