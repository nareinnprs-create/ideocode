<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark" />
    <title>IDEOCODE</title>
  </head>
  <body class="bg-bg-primary text-text-primary font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener("error", function (e) {
        try { window.__TAURI__?.core?.invoke("log_error", { msg: e.message + " at " + e.filename + ":" + e.lineno }); } catch (_) { }
      });
      window.addEventListener("unhandledrejection", function (e) {
        try { window.__TAURI__?.core?.invoke("log_error", { msg: "Unhandled rejection: " + e.reason }); } catch (_) { }
      });
    </script>
  </body>
</html>
