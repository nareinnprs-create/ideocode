[package]
name = "ideocode-tool-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "ideocode_tool_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
ideocode-agent-runtime = { path = "../ideocode-agent-runtime" }
ideocode-message-types = { path = "../ideocode-message-types" }
ideocode-tool-types = { path = "../ideocode-tool-types" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
